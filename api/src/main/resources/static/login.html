<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            background-image: url('images/akatsuki.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #f4f4f4;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #e60000;
            margin-top: 0;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #e60000;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #770606;
        }
        #error {
            color: #c01c28;
            text-align: center;
            font-size: 0.9rem;
            min-height: 20px;
            margin-bottom: 10px;
        }
        .register-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #e60000;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Admin Login</h2>

    <div id="error"></div>

    <form id="login-form">
        <input type="text" id="username" placeholder="Username" required autofocus>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>

    <a href="/register.html" class="register-link">Don't have an account? Register</a>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('error');
        errorEl.textContent = '';

        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });

        if (!res.ok) {
            errorEl.textContent = 'Invalid username or password';
            return;
        }

        const data = await res.json();

        localStorage.setItem('jwt', data.token);

        window.location.href = '/admin-room.html';
    });
</script>
</body>
</html>
