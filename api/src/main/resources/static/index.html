<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Hosting</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;

            /* BACKGROUND IMAGE: Replace with your own image path */
            background-image: url('/images/naruto background.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        /* --- Main Box --- */
        .content-box {
            width: 100%;
            max-width: 900px;
            background-color: #f4f4f4;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            margin-bottom: 50px;
        }

        /* --- Header Area (Inside Box) --- */
        .box-header {
            background-color: #e65100; /* Orange theme */
            color: white;
            padding: 20px 30px;
            border-bottom: 3px solid #000;
        }
        .box-header h1 {
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* --- Content Area --- */
        .box-content {
            padding: 30px;
        }

        /* --- Status Text --- */
        #status {
            color: #555;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        #status.error {
            color: #c01c28;
            font-weight: bold;
        }

        /* --- List Styles --- */
        #topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #topic-list li {
            margin-bottom: 8px;
        }

        #topic-list a {
            display: block;
            padding: 10px 15px;
            background-color: #ffffff;
            color: #333;
            text-decoration: none;
            border: 1px solid #ccc;
            border-left: 5px solid #e65100;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: background-color 0.2s, color 0.2s;
        }

        #topic-list a:hover {
            background-color: #e65100;
            color: #fff;
            border-color: #b33d00;
            border-left-color: #000;
        }

        /* --- SEARCH BAR --- */
        .search-container {
            margin-bottom: 20px;
        }
        .search-container input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-container input:focus {
            border-color: #e65100;
            box-shadow: 0 0 5px rgba(230, 81, 0, 0.4);
        }

        /* --- LIST STYLES --- */
        #topic-list { list-style: none; padding: 0; margin: 0; }
        #topic-list li { margin-bottom: 8px; }

        #topic-list a {
            display: block; padding: 10px 15px; background-color: #ffffff;
            color: #333; text-decoration: none; border: 1px solid #ccc;
            border-left: 5px solid #e65100; border-radius: 4px;
            font-weight: bold; font-size: 1.05rem;
            transition: background-color 0.2s, color 0.2s;
        }

        #topic-list a:hover {
            background-color: #e65100; color: #fff;
            border-color: #b33d00; border-left-color: #000;
        }
    </style>
</head>
<body>

<div class="content-box">
    <div class="box-header">
        <h1>All anime</h1>
    </div>

    <div class="box-content">
        <!-- SEARCH BAR -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search anime by name...">
        </div>

        <p id="status">Loading…</p>
        <ul id="topic-list"></ul>
    </div>
</div>

<script>
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('topic-list');
    const searchInput = document.getElementById('search-input');

    async function loadTopics() {
        try {
            const response = await fetch('/api/topics');
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            allTopics = await response.json();

            if (allTopics.length === 0) {
                statusEl.textContent = 'No anime added yet.';
                statusEl.style.display = 'block';
                return;
            }

            statusEl.style.display = 'none';
            renderTopics(allTopics);

        } catch (err) {
            statusEl.textContent = `Failed to load anime: ${err.message}`;
            statusEl.classList.add('error');
            statusEl.style.display = 'block';
        }
    }

    // --- Render function ---
    function renderTopics(topicsToRender) {
        if (topicsToRender.length === 0) {
            listEl.innerHTML = '<li style="padding: 10px; color: #888;">No anime found matching your search.</li>';
            return;
        }

        listEl.innerHTML = topicsToRender.map(topic => `
                <li>
                    <a href="/topic.html?id=${topic.id}">${escapeHtml(topic.name)}</a>
                </li>
            `).join('');
    }

    // --- Search functionality ---
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();

        // If the search is empty, show all topics
        if (query === '') {
            renderTopics(allTopics);
            return;
        }

        // Filter the array based on the name
        const filtered = allTopics.filter(topic =>
            topic.name.toLowerCase().includes(query)
        );

        renderTopics(filtered);
    });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    loadTopics();
</script>

</body>
</html>
