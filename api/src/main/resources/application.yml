    storage-dir: ${STORAGE_DIR:D:/sod-project/anime/anime-videos}
  jwt:
    secret: ${JWT_SECRET:414E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  registration-secret: ${REGISTRATION_SECRET:fake}
logging:
  level:
    com.example.videohosting.config.GlobalExceptionHandler: DEBUG