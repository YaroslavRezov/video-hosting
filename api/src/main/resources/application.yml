spring:
  application:
    name: video-hosting

  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

  docker:
    compose:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/video-hosting}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

app:
  video:
    storage-dir: ${STORAGE_DIR:/data/videos}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  registration-secret: ${REGISTRATION_SECRET}

logging:
  level:
    com.example.videohosting.config.GlobalExceptionHandler: DEBUG