    name: video-hosting
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/video-hosting
    username: postgres
    password: postgres
app:
