version: '3.8'
services:
  postgres:
    container_name: postgres_container_video_hosting
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video-hosting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

    restart: unless-stopped
volumes:
  pgdata:
