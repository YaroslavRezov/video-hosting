services:
  postgres:
    container_name: postgres_container_video_hosting
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: video-hosting

    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video-hosting"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: video_hosting_app
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-hosting
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      STORAGE_DIR: /data/videos

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000

      REGISTRATION_SECRET: ${REGISTRATION_SECRET}

    volumes:
      - ./data/videos:/data/videos

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  pgdata: