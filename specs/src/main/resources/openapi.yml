openapi: 3.1.0
info:
  title: Video Hosting API
  version: 1.0.0
  description: Anime video hosting — topics and videos

tags:
  - name: TopicController
    description: Topic management
  - name: VideoController
    description: Video management

paths:
  /api/topics:
    get:
      tags: [ TopicController ]
      operationId: getTopics
      summary: List all topics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Topic'
    post:
      tags: [ TopicController ]
      operationId: createTopic
      summary: Create a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Topic'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
  /api/topics/{topicId}:
    get:
      tags: [ TopicController ]
      operationId: getTopic
      summary: Get a topic by id
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '404':
          description: Topic not found
    delete:
      tags: [ TopicController ]
      operationId: deleteTopic
      summary: Delete a topic, its videos from DB, and all files from disk
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted successfully
        '404':
          description: Topic not found
  /api/topics/{topicId}/videos:
    get:
      tags: [ VideoController ]
      operationId: getVideosByTopic
      summary: List videos under a topic, ordered by episode number
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
  /api/videos:
    get:
      tags: [ VideoController ]
      operationId: getVideos
      summary: List all videos, optionally filtered by topic
      parameters:
        - name: topicId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
    post:
      tags: [ VideoController ]
      operationId: createVideo
      summary: Create a video with an uploaded file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file, title, episodeNumber, topicId ]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  maxLength: 250
                episodeNumber:
                  type: integer
                description:
                  type: string
                topicId:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
  /api/videos/{videoId}:
    get:
      tags: [ VideoController ]
      operationId: getVideo
      summary: Get a single video
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '404':
          description: Video not found
    delete:
      tags: [ VideoController ]
      operationId: deleteVideo
      summary: Delete a video and its file
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted successfully
        '404':
          description: Video not found
  /api/videos/{videoId}/next:
    get:
      tags: [ VideoController ]
      operationId: getNextVideo
      summary: Get the next video in the topic
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '404':
          description: No next video (end of series)

  /api/videos/{videoId}/previous:
    get:
      tags: [ VideoController ]
      operationId: getPreviousVideo
      summary: Get the previous video in the topic
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '404':
          description: No previous video (start of series)
  /api/videos/search:
    get:
      tags: [ VideoController ]
      operationId: searchVideos
      summary: Search videos by title
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
  /api/videos/{videoId}/stream:
    get:
      tags: [ VideoController ]
      operationId: streamVideo
      summary: Stream video file bytes (supports HTTP Range)
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Full file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range request)
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '404':
          description: Video not found
  /api/auth/login:
    post:
      tags: [ AuthController ]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
  /api/auth/register:
    post:
      tags: [ AuthController ]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict (Username taken)
components:
  schemas:
    Topic:
      type: object
      required: [ name, releasedAt ]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        releasedAt:
          type: string
          format: date-time

    #    TopicCreateRequest:
    #      type: object
    #      required: [name]
    #      properties:
    #        name:
    #          type: string
    #          maxLength: 255
    #        description:
    #          type: string
    #          nullable: true

    Video:
      type: object
      required: [ id, title, episodeNumber, filePath, topicId, createdAt ]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 250
        episodeNumber:
          type: integer
        description:
          type: string
          nullable: true
        filePath:
          type: string
          maxLength: 500
        topicId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    AuthRequest:
      type: object
      required: [ username, password ]
      properties:
        username: { type: string }
        password: { type: string }
        secret: { type: string }

    AuthResponse:
      type: object
      required: [ token, username ]
      properties:
        token: { type: string }
        username: { type: string }

    MessageResponse:
      type: object
      required: [ message ]
      properties:
        message: { type: string }

